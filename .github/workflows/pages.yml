name: GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      VITE_AUTH_ENABLED: "false"
      VITE_BASE: /skyknight-raven/
      NITRO_PRESET: static
      STATIC: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Stage static site
        run: |
          mkdir -p _site
          if [ -d .output/public ]; then cp -a .output/public/. _site/; fi
          if [ -d dist ]; then cp -a dist/. _site/; fi
          if [ -f _site/_shell.html ] && [ ! -f _site/index.html ]; then cp _site/_shell.html _site/index.html; fi
          if [ -f _site/index.html ]; then cp _site/index.html _site/404.html; fi
          test -f _site/index.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
